name: PixiAudit CD

on:
  workflow_run:
    workflows: ["PixiAudit Compose CI"]
    types:
      - completed
    branches:
      - main

permissions: {}

concurrency:
  group: pixiaudit-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    timeout-minutes: 20
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, pixiaudit-deploy]

    steps:
      - name: Deploy exact successful commit
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          printf '%s\n' "$DEPLOY_SHA" | sudo -n /usr/local/sbin/pixiaudit-deploy
