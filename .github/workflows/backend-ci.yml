name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pixiaudit_test
          POSTGRES_PASSWORD: pixiaudit_test_password
          POSTGRES_DB: pixiaudit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pixiaudit_test -d pixiaudit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4.11
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build backend
        run: npm run build

      - name: Run unit tests
        run: ./node_modules/.bin/jest --config ./test/jest-unit.json --runInBand --silent

      - name: Run PostgreSQL and Redis integration tests
        run: npm run test:integration
        env:
          TEST_DATABASE_HOST: 127.0.0.1
          TEST_DATABASE_PORT: 5432
          TEST_DATABASE_USER: pixiaudit_test
          TEST_DATABASE_PASSWORD: pixiaudit_test_password
          TEST_DATABASE_NAME: pixiaudit_test
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

      - name: Dependency audit (non-blocking for now)
        run: npm audit --audit-level=critical
        continue-on-error: true