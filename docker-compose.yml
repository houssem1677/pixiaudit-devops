
name: pixiaudit

services:
  ollama:
    image: ollama/ollama:0.40.11
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ai-service-network
    restart: unless-stopped

  model-init:
    image: ollama/ollama:0.40.11
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        attempt=0

        until OLLAMA_HOST=http://ollama:11434 ollama list >/dev/null 2>&1; do
          attempt=$$((attempt + 1))

          if [ "$$attempt" -ge 60 ]; then
            echo "ERROR: Ollama API did not become ready after 120 seconds."
            exit 1
          fi

          echo "Waiting for Ollama API (attempt $$attempt/60)..."
          sleep 2
        done

        echo "Ollama API is ready. Checking for Mistral..."

        if OLLAMA_HOST=http://ollama:11434 ollama list \
          | awk 'NR > 1 {print $$1}' \
          | grep -Fxq 'mistral:latest'; then
          echo "Mistral is already installed. Skipping download."
        else
          echo "Mistral is missing. Downloading..."
          OLLAMA_HOST=http://ollama:11434 ollama pull mistral
        fi

        echo "Model initialization completed successfully."
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-service-network
    restart: "no"

  ai-service:
    build: ./ai-service
    depends_on:
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - ai-service-network
      - backend-network
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-network
    restart: unless-stopped

  # Dedicated Node.js + Chrome + Lighthouse service
  lighthouse:
    build: ./lighthouse
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8003/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend-network
    restart: unless-stopped

  # Python scraper: crawling, HTML analysis and audit orchestration
  scraper:
    build: ./scraper
    environment:
      LIGHTHOUSE_SERVICE_URL: http://lighthouse:8003
      BACKEND_URL: http://backend:3001
    depends_on:
      lighthouse:
        condition: service_healthy
    healthcheck:
      test: 
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=5)"
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - backend-network
    restart: unless-stopped

  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: pixiaudit_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: pixiaudit_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pixiaudit_user", "-d", "pixiaudit_db"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - backend-network
    secrets:
      - postgres_password
    restart: unless-stopped

  redis:
    image: redis:7.4.11
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - backend-network
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scraper:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: pixiaudit_user
      DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      DATABASE_NAME: pixiaudit_db
      SCRAPER_URL: http://scraper:8002
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      SMTP_USER: "adc2c7001@smtp-brevo.com"
      SMTP_FROM: "njehm8040@gmail.com"
      SMTP_HOST: smtp-relay.brevo.com
      SMTP_PORT: "587"
      JWT_EXPIRES_IN: 7d
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - frontend-network
      - backend-network
    secrets:
      - postgres_password
      - jwt_secret
      - smtp_password
    restart: unless-stopped

volumes:
  ollama_data:
  postgres_data:
  redis_data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  smtp_password:
    file: ./secrets/smtp_password.txt

networks:
  frontend-network:
  backend-network:
  ai-service-network:
