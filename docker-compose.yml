name: pixiaudit   

services:
  ollama:
    image: ollama/ollama:0.40.11
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - ai-service-network
  model-init:
    image: ollama/ollama:0.40.11
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      until ollama list >/dev/null 2>&1; do sleep 2; done;
      ollama pull mistral
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-service-network

  ai-service:
    build: ./ai-service
    depends_on:
      model-init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - ai-service-network
      - backend-network

  
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000" 
    depends_on:
       backend:
         condition: service_healthy
    networks:
      - frontend-network



  scraper:
    build: ./scraper
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    tmpfs:
      - /tmp/pixiaudit_lighthouse:size=256m
    networks:
      - backend-network



  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_USER: pixiaudit_user
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: pixiaudit_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pixiaudit_user"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - backend-network  
    secrets:
      - postgres_password 


  redis:
    image: redis:7.4.11
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - backend-network
  
 
  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      scraper:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
       DATABASE_HOST : postgres
       DATABASE_PORT : 5432
       DATABASE_USER : pixiaudit_user
       DATABASE_PASSWORD_FILE : /run/secrets/postgres_password
       DATABASE_NAME : pixiaudit_db
       JWT_SECRET_FILE : /run/secrets/jwt_secret
       SMTP_PASSWORD_FILE : /run/secrets/smtp_password
       environment:
       SMTP_USER: "adc2c7001@smtp-brevo.com"
       SMTP_FROM: "njehm8040@gmail.com"
       SMTP_HOST: smtp-relay.brevo.com
       SMTP_PORT: "587"
       JWT_EXPIRES_IN: 7d
    networks:
      - frontend-network
      - backend-network
    secrets:
      - postgres_password
      - jwt_secret
      - smtp_password

      
volumes:
  ollama_data:
  postgres_data:
  redis_data:


secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  smtp_password:
    file: ./secrets/smtp_password.txt


networks:
  frontend-network:
  backend-network:
  ai-service-network: